<!DOCTYPE html>
<!--
  猫狗识别前端页面
  功能：图片上传/拖拽、预览、调用后端 /predict 接口、展示分类结果与置信度
  依赖：须先运行 server.py 或 start.bat 启动本地 Flask 服务
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫狗识别 · Cat vs Dog</title>
  <style>
    /* ── 主题色变量：统一管理配色，方便整体换肤 ── */
    :root {
      --bg: #f5f0e8;
      --surface: #fffdf9;
      --border: #e2d9cc;
      --text: #3d3429;
      --muted: #8a7e72;
      --cat: #e07a3a;
      --dog: #2a9d8f;
      --accent: #c45c26;
      --success: #40916c;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* 背景装饰光晕，不影响交互 */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 15% 8%, rgba(224, 122, 58, 0.14), transparent),
        radial-gradient(ellipse 50% 35% at 85% 85%, rgba(42, 157, 143, 0.12), transparent);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(61, 52, 41, 0.06);
    }

    /* 上传区域：点击或拖拽均可触发文件选择 */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(196, 92, 38, 0.06);
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      line-height: 1;
    }

    .upload-zone h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .upload-zone p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    #fileInput { display: none; }

    /* 预览区默认隐藏，选中图片后通过 .visible 显示 */
    .preview-row {
      display: none;
      gap: 24px;
      align-items: flex-start;
      margin-top: 24px;
    }

    .preview-row.visible {
      display: flex;
      flex-wrap: wrap;
    }

    .preview-img-wrap {
      flex: 0 0 280px;
      border-radius: 12px;
      overflow: hidden;
      background: #ebe4da;
      border: 1px solid var(--border);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-panel {
      flex: 1;
      min-width: 240px;
    }

    .result-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .result-main {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* 识别结果文字颜色随类别变化 */
    .result-main.cat { color: var(--cat); }
    .result-main.dog { color: var(--dog); }

    .confidence-bar {
      margin-bottom: 10px;
    }

    .confidence-bar .label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .bar-track {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .bar-fill.cat { background: var(--cat); }
    .bar-fill.dog { background: var(--dog); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #d4763a);
      color: #fff;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(196, 92, 38, 0.25);
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      margin-top: 16px;
      margin-left: 8px;
    }

    .btn-ghost:hover:not(:disabled) { color: var(--dog); border-color: var(--dog); background: rgba(42, 157, 143, 0.06); }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 16px;
    }

    /* 状态提示：加载中 / 错误信息 */
    .status.visible { display: flex; }
    .status.loading { background: rgba(42, 157, 143, 0.1); color: var(--dog); }
    .status.error { background: rgba(196, 92, 38, 0.1); color: #b84a1e; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .sample-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sample-btn:hover {
      border-color: var(--cat);
      color: var(--cat);
      background: rgba(224, 122, 58, 0.08);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 32px;
    }

    /* 移动端适配：预览图占满宽度 */
    @media (max-width: 600px) {
      .preview-img-wrap { flex: 1 1 100%; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">

    <!-- 页头 -->
    <header>
      <h1>🐱 <span>猫狗识别</span> 🐶</h1>
      <p>基于 ResNet50 的图像分类模型 · 上传图片即可识别</p>
    </header>

    <!-- 主功能区：上传 + 预览 + 识别结果 -->
    <div class="card">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📷</div>
        <h3>点击或拖拽图片到此处</h3>
        <p>支持 JPG、PNG、WEBP 格式</p>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/*">
      </div>

      <!-- 图片预览与识别结果面板 -->
      <div class="preview-row" id="previewRow">
        <div class="preview-img-wrap">
          <img id="previewImg" alt="预览">
        </div>
        <div class="result-panel">
          <div class="result-label">识别结果</div>
          <div class="result-main" id="resultMain">—</div>

          <div class="confidence-bar">
            <div class="label"><span>🐱 猫</span><span id="catPct">0%</span></div>
            <div class="bar-track"><div class="bar-fill cat" id="catBar" style="width:0%"></div></div>
          </div>
          <div class="confidence-bar">
            <div class="label"><span>🐶 狗</span><span id="dogPct">0%</span></div>
            <div class="bar-track"><div class="bar-fill dog" id="dogBar" style="width:0%"></div></div>
          </div>

          <button class="btn btn-primary" id="predictBtn" disabled>开始识别</button>
          <button class="btn btn-ghost" id="resetBtn">换一张</button>
        </div>
      </div>

      <div class="status loading" id="statusLoading">
        <div class="spinner"></div>
        <span>模型推理中，请稍候…</span>
      </div>
      <div class="status error" id="statusError">
        <span id="errorMsg">识别失败</span>
      </div>
    </div>

    <!-- 示例图片快捷按钮，无需本地上传即可体验 -->
    <div class="card">
      <div class="result-label">快速试用示例图片</div>
      <div class="samples" id="samples"></div>
    </div>

    <footer>ResNet50 · PyTorch · 本地推理</footer>
  </div>

  <script>
    // ── DOM 元素引用 ──────────────────────────────────────────
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewRow = document.getElementById('previewRow');
    const previewImg = document.getElementById('previewImg');
    const resultMain = document.getElementById('resultMain');
    const predictBtn = document.getElementById('predictBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusLoading = document.getElementById('statusLoading');
    const statusError = document.getElementById('statusError');
    const errorMsg = document.getElementById('errorMsg');
    const catBar = document.getElementById('catBar');
    const dogBar = document.getElementById('dogBar');
    const catPct = document.getElementById('catPct');
    const dogPct = document.getElementById('dogPct');
    const samplesEl = document.getElementById('samples');

    // 当前待识别的图片文件（File 对象）
    let currentFile = null;

    // 内置示例图片列表，路径相对于 Flask 静态文件服务
    const SAMPLE_IMAGES = [
      { label: '示例猫', path: 'newtest_set/cats/true.jpg' },
      { label: '示例狗', path: 'newtest_set/dogs/31723731_111324918104_2.jpg' },
      { label: '测试猫', path: 'test_set/cats/cat.4001.jpg' },
      { label: '测试狗', path: 'test_set/dogs/dog.4001.jpg' },
    ];

    // ── 上传交互：点击区域触发文件选择器 ────────────────────────
    uploadZone.addEventListener('click', () => fileInput.click());

    // ── 拖拽上传：阻止默认行为并高亮上传区 ──────────────────────
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadFile(fileInput.files[0]);
    });

    predictBtn.addEventListener('click', predict);
    resetBtn.addEventListener('click', reset);

    /**
     * 加载用户选中的图片：生成预览 URL 并显示识别面板
     * @param {File} file - 浏览器 File 对象
     */
    function loadFile(file) {
      currentFile = file;
      previewImg.src = URL.createObjectURL(file);  // 本地临时 URL，无需上传即可预览
      previewRow.classList.add('visible');
      predictBtn.disabled = false;
      hideStatus();
      resetResult();
    }

    /**
     * 加载内置示例图片并自动触发识别
     * @param {string} path  - 示例图片相对路径
     * @param {string} label - 按钮显示名称（未参与逻辑，保留供扩展）
     */
    async function loadSample(path, label) {
      try {
        hideStatus();
        const res = await fetch(path);
        if (!res.ok) throw new Error('示例图片不存在');
        const blob = await res.blob();
        const file = new File([blob], path.split('/').pop(), { type: blob.type });
        loadFile(file);
        await predict();
      } catch (err) {
        showError('加载示例失败：' + err.message);
      }
    }

    /** 清空识别结果展示（置信度进度条归零） */
    function resetResult() {
      resultMain.textContent = '—';
      resultMain.className = 'result-main';
      catBar.style.width = '0%';
      dogBar.style.width = '0%';
      catPct.textContent = '0%';
      dogPct.textContent = '0%';
    }

    /** 重置整个上传状态，回到初始界面 */
    function reset() {
      currentFile = null;
      fileInput.value = '';
      previewRow.classList.remove('visible');
      predictBtn.disabled = true;
      hideStatus();
      resetResult();
    }

    function hideStatus() {
      statusLoading.classList.remove('visible');
      statusError.classList.remove('visible');
    }

    function showError(msg) {
      hideStatus();
      errorMsg.textContent = msg;
      statusError.classList.add('visible');
    }

    /**
     * 将当前图片 POST 到后端 /predict 接口，解析 JSON 并更新 UI
     * 响应格式：{ prediction: "cats"|"dogs", probabilities: { cats, dogs } }
     */
    async function predict() {
      if (!currentFile) return;
      hideStatus();
      predictBtn.disabled = true;
      statusLoading.classList.add('visible');

      const form = new FormData();
      form.append('image', currentFile);

      try {
        const res = await fetch('/predict', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');

        const isCat = data.prediction === 'cats';
        resultMain.textContent = isCat ? '猫 🐱' : '狗 🐶';
        resultMain.className = 'result-main ' + (isCat ? 'cat' : 'dog');

        const cat = (data.probabilities.cats * 100).toFixed(1);
        const dog = (data.probabilities.dogs * 100).toFixed(1);
        catBar.style.width = cat + '%';
        dogBar.style.width = dog + '%';
        catPct.textContent = cat + '%';
        dogPct.textContent = dog + '%';
      } catch (err) {
        showError(err.message + ' — 请确认已运行 start.bat 启动服务');
      } finally {
        statusLoading.classList.remove('visible');
        predictBtn.disabled = false;
      }
    }

    // 动态生成示例图片按钮
    SAMPLE_IMAGES.forEach(({ label, path }) => {
      const btn = document.createElement('button');
      btn.className = 'sample-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => loadSample(path, label));
      samplesEl.appendChild(btn);
    });
  </script>
</body>
</html>
